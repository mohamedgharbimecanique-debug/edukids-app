<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>EduKids — Niveau CP</title>
<style>
body{margin:0;font-family:Arial,sans-serif;background:#fff7ed;color:#17202a}header{padding:24px 18px;background:#ef4444;color:#fff;text-align:center}header h1{margin:0 0 8px}.home{display:inline-block;margin-top:15px;padding:10px 16px;border-radius:999px;background:#fff;color:#b91c1c;text-decoration:none;font-weight:bold}.container{max-width:900px;margin:auto;padding:28px 18px}.card{background:#fff;border-radius:16px;padding:22px;margin:18px 0;box-shadow:0 5px 20px #17202a18}.syllables{display:flex;flex-wrap:wrap;gap:12px}.syllable{border:0;border-radius:12px;padding:15px 18px;background:#fee2e2;color:#991b1b;font-size:1.15rem;font-weight:bold;cursor:pointer}.syllable:active{transform:scale(.97)}.hint{color:#64748b;line-height:1.6}.status{min-height:24px;color:#b91c1c;font-weight:bold}footer{text-align:center;padding:25px;color:#64748b}
</style>
</head>
<body>
<header>
<h1>EduKids — Niveau CP</h1>
<p>Les syllabes : écoute, répète et progresse.</p>
<a class="home" href="index.html">⌂ Accueil</a>
</header>
<main class="container">
<section class="card">
<h2>Écoute les syllabes</h2>
<p class="hint">Appuie sur une syllabe pour l’entendre en français.</p>
<div class="syllables" aria-label="Syllabes à écouter">
<button class="syllable" data-speak="ma">MA</button><button class="syllable" data-speak="me">ME</button><button class="syllable" data-speak="mi">MI</button><button class="syllable" data-speak="mo">MO</button><button class="syllable" data-speak="mu">MU</button>
<button class="syllable" data-speak="la">LA</button><button class="syllable" data-speak="le">LE</button><button class="syllable" data-speak="li">LI</button><button class="syllable" data-speak="lo">LO</button><button class="syllable" data-speak="lu">LU</button>
<button class="syllable" data-speak="pa">PA</button><button class="syllable" data-speak="pe">PE</button><button class="syllable" data-speak="pi">PI</button><button class="syllable" data-speak="po">PO</button><button class="syllable" data-speak="pu">PU</button>
<button class="syllable" data-speak="sa">SA</button><button class="syllable" data-speak="se">SE</button><button class="syllable" data-speak="si">SI</button><button class="syllable" data-speak="so">SO</button><button class="syllable" data-speak="su">SU</button>
</div>
<p class="status" id="status" aria-live="polite"></p>
</section>
<section class="card"><h2>Conseil</h2><p class="hint">Écoute une syllabe, répète-la à voix haute, puis essaie de former un mot avec elle.</p></section>
</main>
<footer>EduKids — Apprendre en s’amusant</footer>
<script>
const status=document.getElementById('status');
const syllableSpeech={ma:'ma',me:'meu',mi:'mi',mo:'mo',mu:'mu',la:'la',le:'leu',li:'li',lo:'lo',lu:'lu',pa:'pa',pe:'peu',pi:'pi',po:'po',pu:'pu',sa:'sa',se:'seu',si:'si',so:'so',su:'su'};
function parler(texte){
  if(!window.speechSynthesis){status.textContent='La lecture audio n’est pas disponible sur cet appareil.';return}
  window.speechSynthesis.cancel();
  const utterance=new SpeechSynthesisUtterance(syllableSpeech[texte]||texte);
  utterance.lang='fr-FR'; utterance.rate=.65; utterance.pitch=1;
  const voix=window.speechSynthesis.getVoices().find(v=>v.lang.toLowerCase().startsWith('fr'));
  if(voix) utterance.voice=voix;
  status.textContent='Écoute : '+texte.toUpperCase();
  utterance.onend=()=>status.textContent='';
  window.speechSynthesis.speak(utterance);
}
document.querySelectorAll('[data-speak]').forEach(button=>button.addEventListener('click',()=>parler(button.dataset.speak)));
</script>
</body>
</html>
