<head>

<title>EduKids — CP</title>
<style>
body{margin:0;font-family:Arial,sans-serif;background:#6b70d8;color:#17202a}.topbar{position:sticky;top:0;z-index:20;display:flex;align-items:center;justify-content:space-between;padding:12px 16px;background:#fff;box-shadow:0 2px 10px #0003}.home{display:inline-block;padding:10px 15px;border-radius:999px;background:#1d4ed8;color:#fff;text-decoration:none;font-weight:bold}.title{font-weight:bold;color:#1d4ed8}.page{max-width:760px;margin:auto;padding:18px 10px 35px}.hero{padding:25px 18px;border-radius:0 0 22px 22px;background:linear-gradient(135deg,#ff8a94,#ffb4a2);text-align:center;color:#fff}.points{display:inline-block;margin:10px;padding:10px 24px;border-radius:30px;background:#ffc21c;color:#503800;font-size:20px}.menu{display:flex;flex-wrap:wrap;gap:12px;margin:18px 0}.menu button{flex:1;min-width:130px;padding:18px;border:0;border-radius:18px;color:#fff;font-size:18px;font-weight:bold;cursor:pointer}.lessons{background:#ffc21c}.quiz{background:#4caf50}.memory{background:#168be0}.card{background:#fff;border-radius:20px;padding:22px;margin:16px 0;box-shadow:0 5px 18px #0002}.card h2{color:#e85b77}.syllables{display:flex;flex-wrap:wrap;gap:9px}.syllable{padding:13px 15px;border:0;border-radius:12px;background:#e8f0ff;color:#174ea6;font-weight:bold;font-size:18px}.listen{margin-top:12px;padding:12px 16px;border:0;border-radius:22px;background:#35ac58;color:#fff;font-weight:bold;font-size:16px}.status{min-height:24px;color:#b91c1c;font-weight:bold}.hint{color:#667085;line-height:1.6}
</style>
</head>
<body>
<nav class="topbar"><a class="home" href="index.html">⌂ Accueil</a><span class="title">EduKids · CP</span></nav>
<header class="hero"><div class="points">50 pts</div><h1>Niveau CP</h1><p>Apprends en t’amusant !</p></header>
<main class="page">
<div class="menu"><button class="lessons" type="button" onclick="document.getElementById('lecons').scrollIntoView()">📚 Leçons</button><button class="quiz" type="button" onclick="document.getElementById('syllabes').scrollIntoView()">❓ Quiz</button><button class="memory" type="button" onclick="document.getElementById('syllabes').scrollIntoView()">🎮 Memory</button></div>
<section id="lecons" class="card"><h2>📚 Leçons CP</h2><article><h3>🔤 Leçon 1 : Les voyelles</h3><p>A — E — I — O — U — Y</p><p class="hint">Exemples : Ananas, Éléphant, Igloo, Orange, Usine.</p><button class="listen" data-speak="Les voyelles : A, E, I, O, U, Y">🔊 Écouter les voyelles</button></article></section>
<section id="syllabes" class="card"><h2>🔤 Leçon 2 : Les syllabes</h2><p class="hint">Écoute chaque syllabe avec un mot exemple pour entendre une prononciation claire.</p><div class="syllables"><button class="syllable" data-speak="BA comme bateau">BA</button><button class="syllable" data-speak="BE comme bébé">BE</button><button class="syllable" data-speak="BI comme bicyclette">BI</button><button class="syllable" data-speak="BO comme ballon">BO</button><button class="syllable" data-speak="BU comme bureau">BU</button><button class="syllable" data-speak="PA comme papa">PA</button><button class="syllable" data-speak="PE comme petit">PE</button><button class="syllable" data-speak="PI comme pirate">PI</button><button class="syllable" data-speak="PO comme pomme">PO</button><button class="syllable" data-speak="PU comme pull">PU</button><button class="syllable" data-speak="MA comme maman">MA</button><button class="syllable" data-speak="ME comme melon">ME</button><button class="syllable" data-speak="MI comme minute">MI</button><button class="syllable" data-speak="MO comme moto">MO</button><button class="syllable" data-speak="MU comme musique">MU</button></div><p class="status" id="status" aria-live="polite"></p></section>
</main>
<script>const status=document.getElementById('status');function parler(texte){if(!window.speechSynthesis){status.textContent='Audio indisponible sur cet appareil.';return}speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(texte);u.lang='fr-FR';u.rate=.72;u.pitch=1;const v=speechSynthesis.getVoices().find(x=>x.lang&&x.lang.toLowerCase().startsWith('fr'));if(v)u.voice=v;status.textContent='Écoute : '+texte;u.onend=()=>status.textContent='';speechSynthesis.speak(u)}document.querySelectorAll('[data-speak]').forEach(b=>b.addEventListener('click',()=>parler(b.dataset.speak)));</script>
</body>
</html>
